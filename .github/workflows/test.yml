name: test

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m compileall -q app scripts tests
      - run: node --check app/static/client.js
      - run: node --check app/static/admin-links.js
      - run: node --check app/static/invite-vault.js
      - run: node --check app/static/link-form.js
      - run: node --test tests/client_delivery.test.cjs tests/admin_links.test.cjs tests/invite_vault.test.cjs
      - run: python -m pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag sideword-server:test .
