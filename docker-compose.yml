services:
  sideword:
    build: .
    image: sideword-server:latest
    container_name: sideword-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sideword-data:/data
      - ./exports:/exports
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sideword-data:
    name: sideword-data
